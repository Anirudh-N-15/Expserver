<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eXpServer</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f4f6f8;
      color: #222;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #fff;
      padding: 2rem 2.5rem;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      max-width: 480px;
      text-align: center;
    }
    h1 { margin-top: 0; }
    code {
      background: #eef1f4;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
    }
  </style>

<body>
  <div class="card">
    <h1>It works!</h1>
    <p>This page is being served by <strong>eXpServer</strong>.</p>
    <p>If you can see this, file serving and the <code>index</code> lookup are working.</p>
  </div>

</html>
